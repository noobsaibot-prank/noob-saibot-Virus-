<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متصمم بحب ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a001a, #4a0033, #000000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 105, 180, 0.3);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 2s ease-in-out;
        }
        .heart {
            font-size: 50px;
            color: #ff3366;
            animation: pulse 1.5s infinite;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            color: #ff99bb;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 153, 187, 0.5);
        }
        .names {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(45deg, #ff3366, #ff99bb, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 10px;
            line-height: 1.8;
            padding: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
            }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>عالم يجمعنا بحب وذوق راقي</h1>
        <div class="names">
            𝑴؁𝑨𝑫𝑶 ♥ 『★』𝓢𝓱𝓸𝓢𝓱𝓸『★』
        </div>
    </div>

</body>
</html>
