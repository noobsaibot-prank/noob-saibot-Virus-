<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOOB SAIBOT // SYSTEM BREACH</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:"Courier New",monospace;
color:#39ff14;
}

body{
display:flex;
align-items:center;
justify-content:center;
}

.scanlines{
position:fixed;
inset:0;
z-index:50;
pointer-events:none;
background:repeating-linear-gradient(
0deg,
rgba(57,255,20,.035) 0,
rgba(57,255,20,.035) 1px,
transparent 1px,
transparent 4px
);
}

.screen{
width:min(1000px,94%);
height:min(700px,90vh);
border:1px solid #174d17;
background:#000802;
box-shadow:
0 0 20px #39ff14,
inset 0 0 80px #001a05;
padding:25px;
position:relative;
overflow:hidden;
}

.header{
display:flex;
justify-content:space-between;
border-bottom:1px solid #164d16;
padding-bottom:12px;
font-size:12px;
}

.blink{
animation:blink .7s infinite;
}

.title{
text-align:center;
font-size:clamp(25px,6vw,60px);
font-weight:bold;
color:#ff2222;
text-shadow:0 0 10px red,0 0 30px red;
margin:30px 0 10px;
animation:glitch 1s infinite;
}

.name{
text-align:center;
font-size:clamp(18px,4vw,38px);
color:#39ff14;
text-shadow:0 0 20px #39ff14;
margin-bottom:25px;
}

.progress{
height:16px;
border:1px solid #39ff14;
box-shadow:0 0 15px #39ff14;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#39ff14;
box-shadow:0 0 25px #39ff14;
}

.percent{
text-align:center;
font-size:20px;
margin:12px;
}

.status{
text-align:center;
font-size:12px;
color:#62ff46;
margin-bottom:15px;
}

.terminal{
direction:ltr;
text-align:left;
height:300px;
overflow:hidden;
font-size:12px;
line-height:1.7;
}

.line{
white-space:nowrap;
}

.green{color:#62ff46}
.red{color:#ff3030;text-shadow:0 0 8px red}
.white{color:white}

/* شاشة الرسائل */

.final{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:#000;
z-index:100;
}

.final.show{
display:flex;
}

.finalText{
font-size:clamp(30px,8vw,90px);
font-weight:bold;
text-align:center;
padding:20px;
color:#39ff14;
text-shadow:
0 0 5px #39ff14,
0 0 20px #39ff14,
0 0 50px #39ff14;
animation:finalGlitch .22s infinite;
}

.final.red .finalText{
color:#ff2020;
text-shadow:
0 0 5px red,
0 0 20px red,
0 0 50px red;
}

.final.white .finalText{
color:#fff;
text-shadow:
0 0 10px #fff,
0 0 30px #39ff14;
}

/* الجمجمة */

.skullScreen{
position:fixed;
inset:0;
z-index:200;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:#000;
opacity:0;
}

.skullScreen.show{
display:flex;
animation:skullAppear 1.5s forwards;
}

.skull{
font-family:"Courier New",monospace;
font-size:clamp(9px,2.5vw,25px);
line-height:1.05;
color:#39ff14;
text-align:center;
white-space:pre;
text-shadow:
0 0 5px #39ff14,
0 0 15px #39ff14,
0 0 35px #39ff14;
animation:skullGlitch .3s infinite;
}

.skullMessage{
margin-top:30px;
font-size:clamp(20px,5vw,55px);
font-weight:bold;
color:#ff2020;
text-align:center;
text-shadow:
0 0 5px red,
0 0 20px red,
0 0 40px red;
animation:messageFlicker .8s infinite;
}

/* اختفاء النهاية */

.skullScreen.fadeOut{
animation:fadeOut 4s forwards;
}

/* Animations */

@keyframes blink{
0%,45%{opacity:1}
46%,100%{opacity:.2}
}

@keyframes glitch{
0%,90%,100%{transform:translate(0)}
92%{transform:translate(-5px,2px)}
94%{transform:translate(5px,-2px)}
96%{transform:translate(-2px,0)}
}

@keyframes finalGlitch{
0%{transform:translate(0)}
20%{transform:translate(-5px,2px)}
40%{transform:translate(5px,-2px)}
60%{transform:translate(-3px,0)}
80%{transform:translate(3px,1px)}
100%{transform:translate(0)}
}

@keyframes skullAppear{
0%{
opacity:0;
transform:scale(1.5);
}
100%{
opacity:1;
transform:scale(1);
}
}

@keyframes skullGlitch{
0%,100%{transform:translate(0)}
25%{transform:translate(-3px,1px)}
50%{transform:translate(3px,-1px)}
75%{transform:translate(-1px,0)}
}

@keyframes messageFlicker{
0%,100%{opacity:1}
50%{opacity:.35}
}

@keyframes fadeOut{
0%{opacity:1}
100%{opacity:0}
}

@media(max-width:600px){

.screen{
padding:15px;
}

.header{
font-size:9px;
}

.terminal{
font-size:10px;
height:270px;
}

}
</style>
</head>

<body>

<div class="scanlines"></div>

<div class="screen" id="screen">

<div class="header">
<span>NOOB-SAIBOT://SYSTEM_ACCESS</span>
<span class="blink">● ONLINE</span>
</div>

<div class="title">
SYSTEM BREACHED
</div>

<div class="name">
༺༽𝑵𝒐𝒐𝒃♕𝑺𝒂𝒊𝒃𝒐𝒕༼༻
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="percent" id="percent">
0%
</div>

<div class="status" id="status">
Initializing system access...
</div>

<div class="terminal" id="terminal"></div>

</div>


<!-- الرسائل النهائية -->

<div class="final" id="final">
<div class="finalText" id="finalText"></div>
</div>


<!-- شاشة الجمجمة -->

<div class="skullScreen" id="skullScreen">

<div class="skull">
        _________
      /           \
     /  █████████  \
    /  ██       ██  \
   |  ██  ●   ●  ██  |
   |  ██    ▄    ██  |
   |  ██  \___/  ██  |
   |   ██       ██   |
    \   █████████   /
     \_____________/
       ██  ██  ██
       ██  ██  ██
      ███  ██  ███
</div>

<div class="skullMessage">
تم القرصنة بنجاح يا ڪ*سمك
</div>

</div>


<script>

const bar=document.getElementById("bar");
const percent=document.getElementById("percent");
const terminal=document.getElementById("terminal");
const status=document.getElementById("status");

const messages=[
"[+] Initializing Noob Saibot protocol...",
"[+] Establishing secure connection...",
"[+] Bypassing authentication...",
"[+] Firewall detected...",
"[+] Firewall bypassed.",
"[+] Scanning system...",
"[+] Accessing security layer...",
"[+] Security layer disabled.",
"[+] Requesting elevated privileges...",
"[+] Privileges granted.",
"[+] Encrypting connection...",
"[+] Upload sequence initialized...",
"[+] Processing...",
"[+] Finalizing access...",
"[!] ACCESS GRANTED"
];

let progress=0;
let messageIndex=0;
let at99=false;


/* =========================================
   التحميل البطيء حتى 99%
========================================= */

const loading=setInterval(function(){

if(progress<99){

progress += 0.35;

if(progress>99){
progress=99;
}

bar.style.width=progress+"%";
percent.textContent=Math.floor(progress)+"%";

status.textContent="Processing system data...";


/* إضافة رسائل أثناء التحميل */

if(
messageIndex<messages.length &&
progress >= ((messageIndex+1)/messages.length)*99
){

const line=document.createElement("div");

line.className=
messages[messageIndex].startsWith("[!]") ?
"line red" :
"line green";

line.textContent=messages[messageIndex];

terminal.appendChild(line);
terminal.scrollTop=terminal.scrollHeight;

messageIndex++;
}

}


/* =========================================
   التوقف عند 99% لمدة 5 ثواني
========================================= */

else if(!at99){

at99=true;

bar.style.width="99%";
percent.textContent="99%";

status.textContent="Finalizing access...";

const line=document.createElement("div");

line.className="line red";

line.textContent="[!] FINAL SECURITY CHECK...";

terminal.appendChild(line);

terminal.scrollTop=terminal.scrollHeight;

clearInterval(loading);


/* الانتظار 5 ثواني */

setTimeout(function(){

/* إكمال 100% */

bar.style.width="100%";
percent.textContent="100%";
status.textContent="ACCESS COMPLETE";

const finalLine=document.createElement("div");

finalLine.className="line red";

finalLine.textContent="[!] SYSTEM ACCESS: 100%";

terminal.appendChild(finalLine);

terminal.scrollTop=terminal.scrollHeight;


/* بدء الرسائل */

setTimeout(startFinalSequence,1200);

},5000);

}

},120);


/* =========================================
   الرسائل واحدة وراء الأخرى
========================================= */

const final=document.getElementById("final");
const finalText=document.getElementById("finalText");

function showMessage(text,type,duration){

return new Promise(function(resolve){

final.className="final show";

if(type){
final.classList.add(type);
}

finalText.textContent=text;

setTimeout(function(){

final.className="final";

resolve();

},duration);

});

}


async function startFinalSequence(){

/* إخفاء شاشة التحميل */

document.getElementById("screen").style.display="none";


/* الرسالة الأولى */

await showMessage(
"HACKED SUCCESSFULLY",
"",
2500
);


/* الرسالة الثانية */

await showMessage(
"VIRUS UPLOADED",
"red",
2500
);


/* الرسالة الثالثة */

await showMessage(
"تم القرصنة بنجاح يا ڪ*سمك",
"white",
3000
);


/* إظهار الجمجمة */

const skullScreen=document.getElementById("skullScreen");

skullScreen.classList.add("show");


/* بعد ظهور الجمجمة، اتركها قليلاً */

setTimeout(function(){

skullScreen.classList.add("fadeOut");


/* بعد الاختفاء تصبح الصفحة سوداء */

setTimeout(function(){

document.body.innerHTML="";
document.body.style.background="#000";

},4000);

},6000);

}

</script>

</body>
  </html>
