<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NOOB SAIBOT // SYSTEM</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020202;
    font-family: "Courier New", monospace;
    color: #00ff55;
}

/* =========================
   MAIN SCREEN
========================= */

body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* Scanlines */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 100;
}

/* Dark vignette */

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle,
            transparent 25%,
            rgba(0,0,0,0.85) 100%
        );

    z-index: 99;
}

/* =========================
   TERMINAL
========================= */

#terminal {
    width: min(900px, 92vw);
    position: relative;
    z-index: 10;
}

.header {
    color: #00ff55;
    font-size: clamp(13px, 2vw, 18px);
    margin-bottom: 18px;
    text-shadow:
        0 0 5px #00ff55,
        0 0 15px #00ff55;
}

.line {
    margin: 8px 0;
    font-size: clamp(13px, 2vw, 17px);
    min-height: 20px;
}

.green {
    color: #00ff55;
}

.red {
    color: #ff2020;
}

.white {
    color: #eee;
}

.yellow {
    color: #ffff00;
}

/* =========================
   PROGRESS
========================= */

.progress-wrapper {
    margin-top: 28px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    margin-bottom: 9px;

    color: #00ff55;
    font-size: 15px;
}

.progress-box {
    width: 100%;
    height: 24px;

    border: 1px solid #00ff55;
    box-shadow:
        0 0 5px #00ff55,
        inset 0 0 10px rgba(0,255,85,0.2);

    padding: 3px;
}

#progress {
    width: 0%;
    height: 100%;

    background:
        repeating-linear-gradient(
            90deg,
            #00ff55 0px,
            #00ff55 8px,
            #00cc44 8px,
            #00cc44 12px
        );

    box-shadow:
        0 0 8px #00ff55,
        0 0 20px #00ff55;

    transition: width 0.12s linear;
}

/* =========================
   CENTER MESSAGES
========================= */

#messageScreen {
    position: fixed;
    inset: 0;

    display: none;
    justify-content: center;
    align-items: center;

    flex-direction: column;

    z-index: 50;

    background:
        radial-gradient(
            circle,
            rgba(0,30,10,0.25),
            rgba(0,0,0,0.96)
        );
}

#message {
    position: relative;

    text-align: center;

    font-size: clamp(25px, 7vw, 70px);
    font-weight: bold;

    color: #00ff55;

    text-shadow:
        0 0 5px #00ff55,
        0 0 15px #00ff55,
        0 0 35px #00ff55;

    animation:
        glitch 0.12s infinite,
        flicker 0.7s infinite;
}

/* =========================
   GLITCH
========================= */

@keyframes glitch {

    0% {
        transform: translate(0);
    }

    20% {
        transform: translate(-3px, 2px);
    }

    40% {
        transform: translate(3px, -2px);
    }

    60% {
        transform: translate(-2px, -1px);
    }

    80% {
        transform: translate(2px, 1px);
    }

    100% {
        transform: translate(0);
    }
}

@keyframes flicker {

    0%, 100% {
        opacity: 1;
    }

    45% {
        opacity: 0.65;
    }

    50% {
        opacity: 1;
    }

    55% {
        opacity: 0.3;
    }

    60% {
        opacity: 1;
    }
}

/* red glitch flash */

.red-glitch {
    animation:
        glitch 0.08s infinite,
        redFlash 0.3s infinite !important;
}

@keyframes redFlash {

    0%, 100% {
        color: #00ff55;

        text-shadow:
            0 0 5px #00ff55,
            0 0 20px #00ff55;
    }

    50% {
        color: #ff2020;

        text-shadow:
            0 0 5px #ff2020,
            0 0 25px #ff2020,
            0 0 50px #ff2020;
    }
}

/* =========================
   FINAL SCREEN
========================= */

#finalScreen {
    position: fixed;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background:
        radial-gradient(
            circle at center,
            rgba(0,50,15,0.35),
            #000 70%
        );

    z-index: 60;

    text-align: center;
}

#noobImage {
    width: min(430px, 78vw);
    max-height: 55vh;

    object-fit: contain;

    opacity: 0;

    filter:
        drop-shadow(0 0 8px #00ff55)
        drop-shadow(0 0 25px #00ff55);

    animation:
        noobAppear 2s forwards,
        noobPulse 2.5s 2s infinite;
}

@keyframes noobAppear {

    from {
        opacity: 0;
        transform: scale(0.7);
        filter:
            brightness(0)
            drop-shadow(0 0 0 transparent);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter:
            drop-shadow(0 0 8px #00ff55)
            drop-shadow(0 0 25px #00ff55);
    }
}

@keyframes noobPulse {

    0%, 100% {
        filter:
            drop-shadow(0 0 8px #00ff55)
            drop-shadow(0 0 25px #00ff55);
    }

    50% {
        filter:
            drop-shadow(0 0 15px #00ff55)
            drop-shadow(0 0 45px #00ff55);
    }
}

.final-title {
    margin-top: 20px;

    color: #00ff55;

    font-size: clamp(28px, 7vw, 65px);
    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 5px #00ff55,
        0 0 15px #00ff55,
        0 0 35px #00ff55;

    animation:
        finalGlitch 0.13s infinite;
}

.final-arabic {
    margin-top: 15px;

    color: #ff2020;

    font-size: clamp(18px, 4vw, 34px);
    font-weight: bold;

    text-shadow:
        0 0 5px #ff2020,
        0 0 15px #ff2020,
        0 0 30px #ff2020;

    direction: rtl;

    animation: finalArabic 1.2s infinite;
}

@keyframes finalGlitch {

    0% {
        transform: translate(0);
    }

    25% {
        transform: translate(-2px, 1px);
    }

    50% {
        transform: translate(2px, -1px);
    }

    75% {
        transform: translate(-1px, -2px);
    }

    100% {
        transform: translate(0);
    }
}

@keyframes finalArabic {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.35;
    }
}

/* =========================
   FADE OUT
========================= */

.fadeOut {
    animation: fadeAway 3s forwards !important;
}

@keyframes fadeAway {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #terminal {
        width: 90vw;
    }

    .line {
        font-size: 12px;
    }

    .progress-box {
        height: 20px;
    }

    #message {
        padding: 20px;
    }

    #noobImage {
        width: 82vw;
    }
}
</style>
</head>

<body>

<!-- =========================
     TERMINAL
========================= -->

<div id="terminal">

    <div class="header">
        [ NOOB SAIBOT // CHAOS SYSTEM ]
    </div>

    <div id="lines"></div>

    <div class="progress-wrapper">

        <div class="progress-text">
            <span id="status">INITIALIZING...</span>
            <span id="percent">0%</span>
        </div>

        <div class="progress-box">
            <div id="progress"></div>
        </div>

    </div>

</div>


<!-- =========================
     CENTER MESSAGES
========================= -->

<div id="messageScreen">
    <div id="message"></div>
</div>


<!-- =========================
     FINAL NOOB SCREEN
========================= -->

<div id="finalScreen">

    <!--
        ضع صورة Noob Saibot التي أرسلتها
        في نفس مجلد index.html
        وسمّها:

        noob.png
    -->

    <img
        id="noobImage"
        src="noob.png"
        alt="Noob Saibot"
    >

    <div class="final-title">
        HACKED SUCCESSFULLY
    </div>

    <div class="final-arabic">
        تم قرصنتك بنجاح يا ڪ*سمك
    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const terminal = document.getElementById("terminal");
const lines = document.getElementById("lines");

const progress = document.getElementById("progress");
const percent = document.getElementById("percent");
const status = document.getElementById("status");

const messageScreen =
    document.getElementById("messageScreen");

const message =
    document.getElementById("message");

const finalScreen =
    document.getElementById("finalScreen");


/* =========================================
   TERMINAL LINES
========================================= */

const terminalLines = [

    "[+] Establishing secure connection...",
    "[+] Initializing NOOB SAIBOT protocol...",
    "[+] Scanning target system...",
    "[+] Searching active processes...",
    "[+] Analyzing system environment...",
    "[+] Loading encrypted modules...",
    "[+] Injecting CHAOS protocol...",
    "[+] Bypassing security layer...",
    "[+] Establishing remote channel...",
    "[+] Preparing final sequence..."

];

let lineIndex = 0;


/* =========================================
   TYPE TERMINAL TEXT
========================================= */

function typeLine(text) {

    return new Promise(resolve => {

        const line = document.createElement("div");

        line.className = "line green";

        lines.appendChild(line);

        let i = 0;

        const interval = setInterval(() => {

            line.textContent += text[i];

            i++;

            if (i >= text.length) {

                clearInterval(interval);

                resolve();
            }

        }, 10);

    });

}


/* =========================================
   LOAD TERMINAL
========================================= */

async function loadTerminal() {

    for (const text of terminalLines) {

        await typeLine(text);

        await sleep(90);
    }

}


/* =========================================
   SLEEP
========================================= */

function sleep(ms) {

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );

}


/* =========================================
   PROGRESS
========================================= */

async function startProgress() {

    /*
        التحميل إلى 99%
        بسرعة واقعية
    */

    for (let i = 0; i <= 99; i++) {

        progress.style.width = i + "%";

        percent.textContent = i + "%";

        if (i < 25) {

            status.textContent =
                "INITIALIZING...";

        } else if (i < 50) {

            status.textContent =
                "SCANNING...";

        } else if (i < 75) {

            status.textContent =
                "PROCESSING...";

        } else {

            status.textContent =
                "UPLOADING...";
        }

        await sleep(
            i < 80 ? 35 : 55
        );
    }


    /*
        التوقف عند 99%
        لمدة 5 ثوان
    */

    status.textContent =
        "FINALIZING...";

    await sleep(5000);


    /*
        100%
    */

    progress.style.width = "100%";

    percent.textContent = "100%";

    status.textContent =
        "COMPLETE";

    await sleep(900);

}


/* =========================================
   MESSAGE SEQUENCE
========================================= */

const messages = [

    {
        text: "HACKED SUCCESSFULLY",
        className: "green"
    },

    {
        text: "VIRUS UPLOADED",
        className: "red"
    },

    {
        text: "تم قرصنتك بنجاح يا ڪ*سمك",
        className: "red"
    }

];


/* =========================================
   SHOW MESSAGE
========================================= */

async function showMessage(item) {

    message.textContent = item.text;

    message.className = "";

    if (item.className === "red") {

        message.classList.add("red-glitch");

    }

    messageScreen.style.display = "flex";

    /*
        الرسالة تظهر
    */

    await sleep(1700);

    /*
        تختفي
    */

    messageScreen.style.display = "none";

    await sleep(500);

}


/* =========================================
   MESSAGE CYCLE
========================================= */

async function runMessages() {

    /*
        الجولة الأولى
    */

    for (const item of messages) {

        await showMessage(item);

    }


    /*
        الجولة الثانية
    */

    await sleep(500);

    for (const item of messages) {

        await showMessage(item);

    }


    /*
        الجولة الثالثة
    */

    await sleep(500);

    for (const item of messages) {

        await showMessage(item);

    }

}


/* =========================================
   FINAL SCREEN
========================================= */

async function showFinal() {

    terminal.style.display = "none";

    finalScreen.style.display = "flex";

    await sleep(7000);

    /*
        اختفاء تدريجي
    */

    finalScreen.classList.add("fadeOut");

}


/* =========================================
   MAIN SEQUENCE
========================================= */

async function start() {

    await loadTerminal();

    await startProgress();

    await sleep(700);

    await runMessages();

    await sleep(800);

    await showFinal();

}


/* =========================================
   START
========================================= */

start();

</script>

</body>
        </html>
